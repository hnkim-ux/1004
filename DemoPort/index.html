<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hnkim · 전장 검증 QA SW 엔지니어</title>
  <meta name="description" content="QA SW 엔지니어 hnkim의 프로필. 전장(차량 전자/전기) 시스템 검증 전문." />
  <meta property="og:title" content="hnkim · 전장 검증 QA SW 엔지니어" />
  <meta property="og:description" content="QA SW 엔지니어 · 전장 시스템 검증 전문" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // 첫 페인트 전에 테마를 적용해 깜빡임을 막는다
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#top"><span class="dot" aria-hidden="true"></span><span data-bind="name"></span></a>
      <nav aria-label="주요 메뉴">
        <ul class="nav-links">
          <li><a href="#about">About</a></li>
          <li><a href="#expertise">Expertise</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="다크/라이트 모드 전환">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container">
        <p class="eyebrow mono" data-bind="role"></p>
        <h1><span data-bind="tagline"></span></h1>
        <p class="lead" data-bind="intro"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#contact">연락하기</a>
          <a class="btn btn-ghost" href="#projects">프로젝트 보기</a>
        </div>
      </div>
      <svg class="wave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave-grid" d="M0 60H1200" />
        <path class="wave-sig" d="M0 60 H120 V25 H200 V95 H260 V25 H380 V95 H420 V60 H560 L590 20 L620 100 L650 60 H760 V25 H840 V95 H900 V25 H980 V60 H1200" />
      </svg>
    </section>

    <section id="about" class="section">
      <div class="container about">
        <h2 class="section-title"><span class="mono">01</span>About</h2>
        <div class="about-grid">
          <div class="about-text" id="about-text"></div>
          <ul class="highlights" id="highlights"></ul>
        </div>
      </div>
    </section>

    <section id="expertise" class="section alt">
      <div class="container">
        <h2 class="section-title"><span class="mono">02</span>Expertise · 전장 검증</h2>
        <div class="cards" id="expertise-list"></div>
      </div>
    </section>

    <section id="skills" class="section">
      <div class="container">
        <h2 class="section-title"><span class="mono">03</span>Skills &amp; Tools</h2>
        <div class="skills" id="skills-list"></div>
      </div>
    </section>

    <section id="projects" class="section alt">
      <div class="container">
        <h2 class="section-title"><span class="mono">04</span>Projects</h2>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>

    <section id="experience" class="section">
      <div class="container">
        <h2 class="section-title"><span class="mono">05</span>Experience</h2>
        <ol class="timeline" id="experience-list"></ol>
      </div>
    </section>

    <section id="contact" class="section alt">
      <div class="container contact">
        <h2 class="section-title"><span class="mono">06</span>Contact</h2>
        <p class="lead">전장 검증, QA 프로세스, 협업 제안 모두 환영합니다.</p>
        <div class="contact-row">
          <a class="btn btn-primary mono" id="email-link" href="#"></a>
          <button class="btn btn-ghost" type="button" id="copy-email">이메일 복사</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container mono">© <span id="year"></span> <span data-bind="name"></span></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
